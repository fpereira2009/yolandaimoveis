name = "yolanda-site"
compatibility_date = "2025-01-01"
pages_build_output_dir = "public"

[[d1_databases]]
binding = "DB"
database_name = "yolanda-crm"
database_id = "f13b20fb-3b81-4dd2-b837-e7b96d28a98d"
migrations_dir = "migrations"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "yolanda-crm-dev"
database_id = "23514b9c-5c0e-464c-8c85-1342b4fae522"
migrations_dir = "migrations"

# R2: binding de produção; mesmas regras de negócio, armazenamento separado por ambiente.
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "yolanda-imoveis-prod"

[vars]
MEDIA_ENV = "production"

# Preview utiliza exclusivamente DB=yolanda-crm-dev + R2 yolanda-imoveis-dev.
[[env.preview.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "yolanda-imoveis-dev"

[env.preview.vars]
MEDIA_ENV = "preview"
